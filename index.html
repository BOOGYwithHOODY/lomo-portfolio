<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LOMO — independent graphic design studio by Mohamad Othman. Brand identity, editorial design and motion, built as systems that outlast trends. Riyadh, KSA." />
    <meta name="theme-color" content="#0A0A0B" />
    <meta property="og:title" content="LOMO — Graphic Design Studio" />
    <meta property="og:description" content="Brand identity, editorial design & motion. Design that speaks, systems that last." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ar_SA" />
    <meta property="og:image" content="https://lomo.studio/hero-media.jpg" />
    <link rel="canonical" href="https://lomo.studio/" />
    <title>LOMO — Graphic Design Studio</title>

    <!-- LCP: the hero media card paints first — fetch it eagerly -->
    <link rel="preload" as="image" href="/hero-media.jpg" fetchpriority="high" />

    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "LOMO Studio",
      "url": "https://lomo.studio/",
      "email": "hello@lomo.studio",
      "description": "Independent graphic design studio — brand identity, editorial design and motion.",
      "address": { "@type": "PostalAddress", "addressLocality": "Riyadh", "addressCountry": "SA" },
      "founder": { "@type": "Person", "name": "Mohamad Othman", "jobTitle": "Creative Director" },
      "knowsLanguage": ["en", "ar"]
    }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Bebas+Neue&family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300;1,9..40,400&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
